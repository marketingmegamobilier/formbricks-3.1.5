x-environment: &environment
  environment:
    # NOTE: optional vars (SMTP, OAuth, S3, legal, etc.) are NOT listed here on purpose —
    # empty strings crash the app's env validation. They are passed via env_file (.env):
    # present in .env => set in container; absent => completely unset.

    # The url of your Formbricks instance used in the admin panel
    WEBAPP_URL: ${WEBAPP_URL:?WEBAPP_URL is required — set it in docker/.env}

    # Required for next-auth. Defaults to WEBAPP_URL
    NEXTAUTH_URL: ${NEXTAUTH_URL:-${WEBAPP_URL}}

    # PostgreSQL DB for Formbricks to connect to
    # Defaults to the bundled postgres service (password configurable via POSTGRES_PASSWORD)
    DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/formbricks?schema=public}

    # NextJS Auth — generate with: openssl rand -hex 32
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — set it in docker/.env}

    # Used for 2FA & Single use URLs for Link Surveys — openssl rand -hex 32
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required — set it in docker/.env}

    # API Secret for running cron jobs — openssl rand -hex 32
    CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required — set it in docker/.env}

    # Feature flags (safe defaults, never empty)
    EMAIL_VERIFICATION_DISABLED: ${EMAIL_VERIFICATION_DISABLED:-1}
    PASSWORD_RESET_DISABLED: ${PASSWORD_RESET_DISABLED:-1}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-0}


services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}


  formbricks:
    restart: always
    image: holdingmendieta/custom-formbricks:3.1.5
    # image: ghcr.io/formbricks/formbricks:v3.1.5
    depends_on:
      - postgres
    expose:
      - 3000
    volumes:
      - ../files/uploads:/home/nextjs/apps/web/uploads/
    # Every var defined (and uncommented) in .env is injected verbatim;
    # vars absent from .env are simply not set in the container.
    env_file:
      - path: .env
        required: false
    <<: *environment

volumes:
  postgres:
    driver: local
  uploads:
